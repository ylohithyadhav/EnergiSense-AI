<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Smart Building Polygon -->
  <path d="M 50,8 L 88,28 L 88,72 L 50,92 L 12,72 L 12,28 Z" fill="#0f172a" stroke="url(#gradPrimary)" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Architectural Grid / Neural Nodes -->
  <line x1="28" y1="36" x2="28" y2="64" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="72" y1="36" x2="72" y2="64" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="28" y1="50" x2="72" y2="50" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Dynamic Energy Pulse / Lightning Bolt overlaid with ML Sine Node -->
  <path d="M 54,20 L 38,48 L 50,48 L 44,78 L 66,44 L 52,44 Z" fill="url(#gradAccent)" filter="url(#glow)" />

  <!-- Neural Connection Nodes -->
  <circle cx="28" cy="36" r="3" fill="#06b6d4" />
  <circle cx="72" cy="36" r="3" fill="#2563eb" />
  <circle cx="28" cy="64" r="3" fill="#06b6d4" />
  <circle cx="72" cy="64" r="3" fill="#2563eb" />
  <circle cx="50" cy="92" r="3" fill="#10b981" />
  <circle cx="50" cy="8" r="3.5" fill="#38bdf8" />
</svg>
