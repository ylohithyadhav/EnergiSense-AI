services:
  - type: web
    name: energisense-ai-backend
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
      - key: ALLOWED_ORIGINS
        value: "*"
